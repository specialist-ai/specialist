name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'

env:
  UV_FROZEN: "1"

jobs:
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run ruff check
        run: uvx ruff@0.15.0 check --diff src/ tests/ scripts/ packages/
      - name: Run ruff format
        run: uvx ruff@0.15.0 format --diff src/ tests/ scripts/ packages/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --no-group gpu --no-install-package specialist-description
      - name: Run mypy
        run: uv run --no-sync mypy

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install FFmpeg (rerun's Mp4Reader shells out to it in the video tests)
        run: sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: uv sync --no-group gpu --no-install-package specialist-description
      - name: Run tests
        run: uv run --no-sync pytest || [ $? -eq 5 ]
