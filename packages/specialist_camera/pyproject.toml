[project]
name = "specialist-camera"
version = "0.1.0"
description = "The MEI fisheye lens: parameters, projection, and rescaling"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
dependencies = ["numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specialist_camera"]
