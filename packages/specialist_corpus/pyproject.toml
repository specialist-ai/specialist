[project]
name = "specialist-corpus"
version = "0.1.0"
description = "The corpus contract: schema, version gate, selectors, and conventions"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "pyarrow>=18",
  # Each Rerun minor release breaks some API, so the pin holds one minor.
  "rerun-sdk[catalog]>=0.41.0,<0.42",
  # A reader builds its own column expressions on datafusion directly.
  "datafusion>=50",
  "specialist-camera==0.1.0",
  "av>=13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specialist_corpus"]
