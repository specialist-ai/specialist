[project]
name = "specialist"
version = "0.1.0"
description = "Multi-camera AprilTag SLAM for humanoid data collection"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
dependencies = [
  "gtsam>=4.3a0",
  "numpy>=1.26",
  "scipy>=1.11",
  "rerun-sdk>=0.21",
  "tyro>=0.9",
  "telemetry-parser>=0.3",
  "opencv-python>=4.10",
  "pupil-apriltags>=1.0.4",
  "allantools>=2024.6",
  "pyyaml>=6.0",
  "robot-descriptions",
  # Wheel-bundled static ffmpeg so multi-clip audio clap-sync works on every
  # platform via `uv sync` (no system ffmpeg / sudo, e.g. the headless server).
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff==0.15.0",
  "mypy>=1.13",
  "pre-commit>=3.8",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
robot-descriptions = { git = "ssh://git@github.com/T-K-233/specialist_description.git" }

[tool.hatch.build.targets.wheel]
packages = ["src/specialist"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
indent-width = 2
exclude = []

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/specialist"]

[[tool.mypy.overrides]]
module = [
  "gtsam", "gtsam.*",
  "rerun", "rerun.*",
  "scipy", "scipy.*",
  "telemetry_parser", "telemetry_parser.*",
  "cv2", "cv2.*",
  "pupil_apriltags", "pupil_apriltags.*",
  "allantools", "allantools.*",
  "imageio_ffmpeg", "imageio_ffmpeg.*",
]
ignore_missing_imports = true
