[project]
name = "specialist"
version = "0.1.0"
description = "Multi-camera AprilTag SLAM for human data collection"
requires-python = ">=3.14,<3.15"
license = {text = "MIT"}
dependencies = [
  # Pinned exactly: the native MEI factor links this wheel's libgtsam.
  "gtsam==4.3.0",
  "numpy>=1.26",
  "scipy>=1.11",
  # The [catalog] extra is the catalog client and its query engine.
  "rerun-sdk[catalog]>=0.42.0,<0.43",
  "av>=13",
  "tyro>=0.9",
  "telemetry-parser>=0.4",
  "opencv-python>=4.10",
  "pupil-apriltags>=1.0.4",
  "allantools>=2024.6",
  "specialist-description",
  "specialist-camera",
  "specialist-dataset",
  # Wheel-bundled static ffmpeg: audio sync needs no system install.
  "imageio-ffmpeg>=0.5",
]

[dependency-groups]
# CUDA backends; the linux markers keep the group empty where no CUDA wheels exist.
gpu = [
  # The [ctk] and [cu12] extras carry the CUDA 12 runtime these wheels load at import.
  "cupy-cuda12x[ctk]>=14.1; sys_platform == 'linux'",
  "nvmath-python[cu12]>=1.0; sys_platform == 'linux'",
  "nvidia-cudss-cu12>=0.8; sys_platform == 'linux'",
  "torch>=2.11; sys_platform == 'linux'",
  # The vendored DIS kernels call triton directly (@triton.jit).
  "triton>=3.4; sys_platform == 'linux'",
]
dev = [
  "pytest>=8.0",
  "ruff==0.15.0",
  "mypy>=1.13",
  "pre-commit>=3.8",
  # For rebuilding the native MEI factor by hand (`uv run build-mei-factor`).
  "pybind11==3.0.4",
]

[build-system]
requires = ["hatchling", "gtsam==4.3.0", "pybind11==3.0.4", "numpy>=1.26"]
build-backend = "hatchling.build"

[project.scripts]
build-mei-factor = "specialist.vi_ba._buildext:main"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
default-groups = ["dev", "gpu"]
# The platforms the native factor and the hosted wheels are built for.
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
specialist-description = { git = "ssh://git@github.com/specialist-ai/specialist_description.git", branch = "main" }
specialist-camera = { workspace = true }
specialist-dataset = { workspace = true }
# PyPI carries no cp314 wheel; these are built from upstream a4a2fbde (specialist-ai/wheels).
telemetry-parser = [
  { url = "https://github.com/specialist-ai/wheels/releases/download/telemetry-parser-0.4.0-a4a2fbde-2/telemetry_parser-0.4.0-cp314-cp314-manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux'" },
  { url = "https://github.com/specialist-ai/wheels/releases/download/telemetry-parser-0.4.0-a4a2fbde-2/telemetry_parser-0.4.0-cp314-cp314-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin'" },
]
# CUDA 12.9 builds: Blackwell (sm_120) kernels on the CUDA 12 toolkit cuDSS pins.
torch = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux'" }]
triton = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/specialist"]
# The C++ source ships; the compiled extension (gitignored) is force-included.
artifacts = ["src/specialist/vi_ba/_mei_factor_cpp*"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]

[tool.ruff]
src = ["src"]
indent-width = 2

[tool.ruff.format]
# Vendored DIS optical-flow kernels, kept in their upstream style.
exclude = ["src/specialist/vi_ba/gpu_dis/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ARG"]

[tool.ruff.lint.per-file-ignores]
"src/specialist/vi_ba/gpu_dis/*" = ["ARG002", "E702", "E741", "I001", "B905"]
"tests/*" = ["ARG001", "ARG002", "ARG004", "ARG005"]
"hatch_build.py" = ["ARG002"]

[tool.mypy]
python_version = "3.14"
strict = true
files = [
  "packages/specialist_camera/src/specialist_camera",
  "packages/specialist_dataset/src/specialist_dataset",
  "src/specialist",
  "scripts/estimate.py",
  "scripts/convert.py",
  "scripts/state.py",
  "scripts/catalog.py",
  "scripts/_probe.py",
  "scripts/imu.py",
  "scripts/video_imu_timing.py",
]
# Each member's src is a module base, so every module resolves under one name.
mypy_path = [
  "src",
  "packages/specialist_camera/src",
  "packages/specialist_dataset/src",
]
explicit_package_bases = true
# The vendored DIS kernels are untyped research code.
exclude = ["src/specialist/vi_ba/gpu_dis/"]

[[tool.mypy.overrides]]
module = [
  "cupy", "cupy.*", "cupyx", "cupyx.*",
  "nvmath", "nvmath.*",
  "specialist.vi_ba._mei_factor_cpp",
  "pyarrow", "pyarrow.*",
  "scipy", "scipy.*",
  "telemetry_parser", "telemetry_parser.*",
  "cv2", "cv2.*",
  "pupil_apriltags", "pupil_apriltags.*",
  "allantools", "allantools.*",
  "imageio_ffmpeg", "imageio_ffmpeg.*",
  "torch", "torch.*", "triton", "triton.*",
  "nvidia", "nvidia.*",
  "specialist_description", "specialist_description.*",
]
ignore_missing_imports = true

# The gtsam wheel's generated stubs mistype Point3, Quaternion and the noise-model overloads.
[[tool.mypy.overrides]]
module = ["gtsam", "gtsam.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

# `exclude` only stops directory discovery; mypy still follows the import.
[[tool.mypy.overrides]]
module = ["specialist.vi_ba.gpu_dis.*"]
follow_imports = "skip"
