[project]
name = "specialist"
version = "0.1.0"
description = "Multi-camera AprilTag SLAM for humanoid data collection"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
dependencies = [
  # Pinned exactly: the native MEI factor links this wheel's libgtsam.
  "gtsam==4.3a0",
  "numpy>=1.26",
  "scipy>=1.11",
  "rerun-sdk>=0.21",
  "tyro>=0.9",
  "telemetry-parser>=0.3",
  "opencv-python>=4.10",
  "pupil-apriltags>=1.0.4",
  "allantools>=2024.6",
  "pyyaml>=6.0",
  "robot-descriptions",
  # Wheel-bundled static ffmpeg so multi-clip audio clap-sync works on every
  # platform via `uv sync` (no system ffmpeg / sudo, e.g. the headless server).
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# CUDA backend for the Schur LM solver (`solver.gpu`); the tracker falls back
# to the gtsam optimizer when these are absent. The markers keep the extra empty
# where no CUDA wheels exist, so `uv sync --extra gpu` is a no-op there rather
# than a resolution failure.
gpu = [
  # The [ctk] and [cu12] extras carry the CUDA 12 runtime libraries these
  # wheels load at import.
  "cupy-cuda12x[ctk]>=14.1; sys_platform == 'linux'",
  "nvmath-python[cu12]>=1.0; sys_platform == 'linux'",
  "nvidia-cudss-cu12>=0.8; sys_platform == 'linux'",
]
dev = [
  "pytest>=8.0",
  "ruff==0.15.0",
  "mypy>=1.13",
  "pre-commit>=3.8",
  "types-pyyaml>=6.0",
  # For rebuilding the native MEI factor by hand (`uv run build-mei-factor`).
  "pybind11==2.13.6",
]

[build-system]
requires = ["hatchling", "gtsam==4.3a0", "pybind11==2.13.6", "numpy>=1.26"]
build-backend = "hatchling.build"

[project.scripts]
build-mei-factor = "specialist.vi_ba._buildext:main"

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
robot-descriptions = { git = "ssh://git@github.com/T-K-233/specialist_description.git" }

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/specialist"]
# The C++ source ships; the compiled extension (gitignored) is force-included.
artifacts = ["src/specialist/vi_ba/_mei_factor_cpp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
indent-width = 2
exclude = []

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/specialist"]

[[tool.mypy.overrides]]
module = [
  "gtsam", "gtsam.*",
  "cupy", "cupy.*", "cupyx", "cupyx.*",
  "nvmath", "nvmath.*",
  "specialist.vi_ba._mei_factor_cpp",
  "rerun", "rerun.*",
  "scipy", "scipy.*",
  "telemetry_parser", "telemetry_parser.*",
  "cv2", "cv2.*",
  "pupil_apriltags", "pupil_apriltags.*",
  "allantools", "allantools.*",
  "imageio_ffmpeg", "imageio_ffmpeg.*",
]
ignore_missing_imports = true
